# 移行パッケージ（.claude/）の文字コード・設定ファイルの構文・秘密情報を、push と PR のたびに検査する。
# ~/.claude との差分は移行先の端末が要るので CI では行わない。
# サプライチェーン対策: Actions はコミット SHA、gitleaks は版と SHA-256 で固定する。
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks で全履歴を検査するため
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: 文字コード・BOM・改行コード（リポジトリ全体）
        run: python -I .claude/scripts/check-encoding.py . --quiet

      - name: settings.json の構文
        run: python -I -m json.tool .claude/settings.json > /dev/null

      - name: Python スクリプトの構文
        run: python -I -m py_compile .claude/hooks/*.py .claude/scripts/*.py .claude/skills/*/scripts/*.py

      - name: シェルスクリプトの構文
        run: for f in .claude/hooks/*.sh .claude/scripts/*.sh .claude/skills/*/scripts/*.sh; do bash -n "$f"; done

      - name: gitleaks を取得して照合する
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks

      - name: 秘密情報（全履歴）
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'
